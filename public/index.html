<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hybrid Huffman Web Compressor</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 600px;
      max-width: 95%;
      transition: all 0.3s ease;
    }
    .container:hover { transform: translateY(-5px); }

    h1 {
      text-align: center;
      color: #2575fc;
      margin-bottom: 25px;
      font-size: 2em;
    }

    .section {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border-left: 6px solid #2575fc;
      transition: all 0.3s ease;
    }
    .section:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    .section h2 {
      margin-bottom: 15px;
      color: #6a11cb;
    }

    input[type="file"], select {
      width: 100%;
      padding: 10px;
      margin: 10px 0 15px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1em;
    }

    button {
      background: #6a11cb;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover { background: #2575fc; }

    .result {
      margin-top: 15px;
      font-size: 14px;
      color: #28a745;
    }

    a {
      color: #6a11cb;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .spinner {
      margin: 20px auto;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #6a11cb;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .note {
      margin-top: 15px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }

    /* Responsive */
    @media(max-width: 640px) {
      .container { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hybrid Huffman Web Compressor</h1>

    <div class="section">
      <h2>Compress</h2>
      <input type="file" id="file1" accept=".huff"/>
      <label>Compression Level:</label>
      <select id="level">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button onclick="doCompress()">Compress</button>
      <div class="result" id="compressResult"></div>
    </div>

    <div class="section">
      <h2>Decompress</h2>
      <input type="file" id="file2" accept=".huff"/>
      <button onclick="doDecompress()">Decompress</button>
      <div class="result" id="decompressResult"></div>
    </div>

    <div class="spinner" id="spinner"></div>

    <div class="note">Supports text files (Huffman). Made with ❤️ by Dhanashree</div>
  </div>

  <script>
const spinner = document.getElementById("spinner");

async function sendForm(url, formData, resultId) {
  spinner.style.display = "block";
  try {
    const res = await fetch(url, { method: "POST", body: formData });
    if (!res.ok) throw new Error("Server error");

    const data = await res.json();

    if (resultId === "compressResult") {
      // For compression, show sizes and ratio
      document.getElementById(resultId).innerHTML = `
        <p><b>Download:</b> <a href="/downloads/${data.filename}" download>${data.filename}</a></p>
        <p><b>Original Size:</b> ${(data.originalSize/1024).toFixed(2)} KB</p>
        <p><b>Processed Size:</b> ${(data.processedSize/1024).toFixed(2)} KB</p>
        <p><b>Compression Ratio:</b> ${data.ratio}%</p>
      `;
    } else {
      // For decompression, only show download link
      document.getElementById(resultId).innerHTML = `
        <p><b>Download:</b> <a href="/downloads/${data.filename}" download>${data.filename}</a></p>
      `;
    }

  } catch (err) {
    document.getElementById(resultId).innerText = "Error: " + err.message;
  } finally {
    spinner.style.display = "none";
  }
}

function doCompress() {
  const f = document.getElementById("file1").files[0];
  if (!f) return alert("Please select a file!");
  const level = document.getElementById("level").value;
  const form = new FormData();
  form.append("file", f);
  sendForm(`/compress/${level}`, form, "compressResult");
}

function doDecompress() {
  const f = document.getElementById("file2").files[0];
  if (!f) return alert("Please select a file!");
  const form = new FormData();
  form.append("file", f);
  sendForm(`/decompress`, form, "decompressResult");
}
</script>

</body>
</html>
